name: Release

# Pushing a tag such as v1.0.0 builds the app on macOS and publishes a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: VERSION="${GITHUB_REF_NAME}" ./build-app.sh

      - name: Zip and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One asset with a fixed name, so releases/latest/download/CSV-to-Numbers.zip always works.
          # The zip holds the app plus the printable guide (built from guide/ and committed).
          mkdir stage
          ditto "dist/CSV to Numbers.app" "stage/CSV to Numbers.app"
          cp "guide/CSV to Numbers - Guide.pdf" "stage/Read Me First - CSV to Numbers.pdf"
          ditto -c -k "stage" CSV-to-Numbers.zip
          gh release create "$GITHUB_REF_NAME" CSV-to-Numbers.zip \
            --title "CSV to Numbers ${GITHUB_REF_NAME}" \
            --generate-notes

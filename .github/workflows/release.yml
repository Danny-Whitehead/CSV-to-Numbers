name: Release

# Pushing a tag such as v1.0.0 builds the app on macOS and publishes a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./build-app.sh

      - name: Zip and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="CSV-to-Numbers-${GITHUB_REF_NAME}.zip"
          ditto -c -k --keepParent "dist/CSV to Numbers.app" "$ZIP"
          cp "$ZIP" CSV-to-Numbers.zip
          gh release create "$GITHUB_REF_NAME" "$ZIP" CSV-to-Numbers.zip \
            --title "CSV to Numbers ${GITHUB_REF_NAME}" \
            --generate-notes
